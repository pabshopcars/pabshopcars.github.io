<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAB SHOP</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: #000; color: #a3a3a3;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    a { color: #f5c000; font-weight: 700; }
  </style>
  <script>
    // The old site had every car at /cars/cars.html?id=…; the site now puts it at /car.html?id=…,
    // so links people already have keep working.
    (function () {
      var id = new URLSearchParams(location.search).get("id");
      location.replace(id ? "/car.html?id=" + encodeURIComponent(id) : "/");
    })();
  </script>
</head>
<body>
  <p>Taking you to the car… <a href="/">All cars</a></p>
</body>
</html>

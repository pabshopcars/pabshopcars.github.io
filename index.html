<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Used cars for sale - PAB SHOP</title>
  <meta name="description" content="Used cars for sale from PAB SHOP. Photos, mileage and a price for every car. Call or text about any of them.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/theme.js?v=bbf9148ba4"></script>
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css?v=4534f61ef0">
</head>
<body>
<script src="js/icons.js?v=18eb1e76f5"></script>
<a class="skip" href="#view">Skip to content</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html">PAB SHOP</a>
    <nav class="topnav" aria-label="Main">
      <a href="index.html" data-nav="sale" aria-current="page">For sale</a>
      <a href="sold.html" data-nav="sold">Sold</a>
    </nav>
    <button class="icon-btn" type="button" data-toggle-theme></button>
    <a class="btn btn-accent call-top" data-tel><svg class="ic" aria-hidden="true"><use href="#phone"></use></svg><span data-phone-label></span></a>
  </div>
</header>

<div id="view" data-page="home" tabindex="-1" aria-busy="true">

<main>
  <section class="wrap intro">
    <h1 id="homeTitle">Cars for sale</h1>

    <div class="toolbar" role="search">
      <label class="search">
        <svg class="ic" aria-hidden="true"><use href="#search"></use></svg>
        <span class="visually-hidden">Search cars</span>
        <input id="q" type="search" placeholder="Make, model or year" autocomplete="off" enterkeyhint="search">
      </label>
    </div>
  </section>

  <section class="wrap" id="inventory" aria-labelledby="inventoryHeading">
    <h2 class="visually-hidden" id="inventoryHeading">Cars for sale</h2>
    <div class="list-head">
      <p class="result-count" id="resultCount" aria-live="polite"></p>
      <div class="sort">
        <button class="sort-button" id="sortButton" type="button" popovertarget="sortMenu" aria-haspopup="listbox" aria-expanded="false">
          <svg class="ic" aria-hidden="true"><use href="#sparkles"></use></svg>
          <span><span class="visually-hidden">Sort: </span><span id="sortLabel">Newest</span></span>
          <svg class="ic chevron" aria-hidden="true"><use href="#chevron-down"></use></svg>
        </button>
        <div class="sort-menu" id="sortMenu" popover role="listbox" aria-label="Sort cars">
          <button type="button" role="option" data-sort="newest"><svg class="ic" aria-hidden="true"><use href="#sparkles"></use></svg><span>Newest</span><svg class="ic check" aria-hidden="true"><use href="#check"></use></svg></button>
          <button type="button" role="option" data-sort="price-asc"><svg class="ic" aria-hidden="true"><use href="#trending-down"></use></svg><span>Lowest price</span><svg class="ic check" aria-hidden="true"><use href="#check"></use></svg></button>
          <button type="button" role="option" data-sort="price-desc"><svg class="ic" aria-hidden="true"><use href="#trending-up"></use></svg><span>Highest price</span><svg class="ic check" aria-hidden="true"><use href="#check"></use></svg></button>
          <button type="button" role="option" data-sort="miles"><svg class="ic" aria-hidden="true"><use href="#gauge"></use></svg><span>Lowest miles</span><svg class="ic check" aria-hidden="true"><use href="#check"></use></svg></button>
          <button type="button" role="option" data-sort="year"><svg class="ic" aria-hidden="true"><use href="#calendar"></use></svg><span>Newest year</span><svg class="ic check" aria-hidden="true"><use href="#check"></use></svg></button>
        </div>
      </div>
    </div>
    <ul class="car-grid" id="carGrid">
    <li class="car-card skeleton" aria-hidden="true"><div class="car-photo"></div><p class="skeleton-line"></p><p class="skeleton-line short"></p></li>
    <li class="car-card skeleton" aria-hidden="true"><div class="car-photo"></div><p class="skeleton-line"></p><p class="skeleton-line short"></p></li>
    </ul>
    <div class="empty" id="empty" hidden>
      <svg class="ic empty-icon" aria-hidden="true"><use href="#search"></use></svg>
      <h2>No cars match</h2>
      <button class="btn btn-quiet" type="button" id="clearSearch">Show all cars</button>
    </div>
  </section>

  <section class="wrap sold-strip" id="soldStrip" aria-labelledby="soldHeading">
    <div class="strip-head">
      <h2 id="soldHeading">Recently sold</h2>
      <a href="sold.html">See all<svg class="ic" aria-hidden="true"><use href="#arrow-right"></use></svg></a>
    </div>
    <ul class="sold-row" id="soldRow"></ul>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-brand">PAB SHOP</p>
    <ul class="footer-contact" aria-label="Contact">
      <li><a data-tel><svg class="ic" aria-hidden="true"><use href="#phone"></use></svg><span data-phone-label></span></a></li>
      <li><a data-tel2><svg class="ic" aria-hidden="true"><use href="#phone"></use></svg><span data-phone2-label></span></a></li>
      <li><a data-email><svg class="ic" aria-hidden="true"><use href="#mail"></use></svg><span data-email-label></span></a></li>
    </ul>
    <div class="footer-mock">
      <p>Preview of the new design</p>
      <div class="preview-switches">
        <div class="theme-switch" role="group" aria-label="Color theme">
          <button type="button" data-set-theme="plate"><svg class="ic" aria-hidden="true"><use href="#sun"></use></svg>Light</button>
          <button type="button" data-set-theme="black"><svg class="ic" aria-hidden="true"><use href="#moon"></use></svg>Black</button>
        </div>
        <div class="theme-switch" role="group" aria-label="Photo style">
          <button type="button" data-set-photos="fit"><svg class="ic" aria-hidden="true"><use href="#crop"></use></svg>Fit</button>
          <button type="button" data-set-photos="pop"><svg class="ic" aria-hidden="true"><use href="#layers"></use></svg>Pop-out</button>
        </div>
      </div>
    </div>
  </div>
</footer>

<div class="contact-bar">
  <a class="btn btn-accent" data-tel><svg class="ic" aria-hidden="true"><use href="#phone"></use></svg><span>Call Denys</span></a>
  <a class="btn btn-quiet" data-sms><svg class="ic" aria-hidden="true"><use href="#message-square"></use></svg><span>Text</span></a>
</div>

</div>

<script src="js/data.js?v=6fc4bc2c4c"></script>
<script src="js/photos.js?v=2fb49b15fa"></script>
<script src="js/site.js?v=682b6d712d"></script>
</body>
</html>
